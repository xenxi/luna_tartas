<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title description">
  <title id="title">Revisión de la dirección visual provisional</title>
  <desc id="description">Lámina interna con paleta, tipografía y composiciones esquemáticas de móvil y escritorio. No es un activo de producción.</desc>
  <rect width="1440" height="1000" fill="#FFF8F0"/>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#2F211D">
    <text x="72" y="72" font-size="16" font-weight="700" letter-spacing="2" fill="#8F294B">DOCUMENTACIÓN · NO PUBLICAR</text>
    <text x="72" y="126" font-family="ui-serif, Georgia, serif" font-size="48" font-weight="700">Obrador editorial cálido</text>
    <text x="72" y="162" font-size="18" fill="#6F5A51">Dirección provisional · producto y contenido primero · identidad pendiente</text>

    <g transform="translate(72 210)">
      <text y="0" font-size="14" font-weight="700" letter-spacing="1.5">PALETA FUNCIONAL</text>
      <g transform="translate(0 24)">
        <rect width="156" height="94" rx="12" fill="#2F211D"/>
        <text x="16" y="58" font-size="16" fill="#FFFFFF">Tinta</text>
        <text x="16" y="80" font-size="13" fill="#FFFFFF">#2F211D</text>
      </g>
      <g transform="translate(172 24)">
        <rect width="156" height="94" rx="12" fill="#8F294B"/>
        <text x="16" y="58" font-size="16" fill="#FFFFFF">Acción</text>
        <text x="16" y="80" font-size="13" fill="#FFFFFF">#8F294B</text>
      </g>
      <g transform="translate(344 24)">
        <rect width="156" height="94" rx="12" fill="#C45E47"/>
        <text x="16" y="58" font-size="16" fill="#2F211D">Acento</text>
        <text x="16" y="80" font-size="13" fill="#2F211D">Sólo decorativo</text>
      </g>
      <g transform="translate(516 24)">
        <rect width="156" height="94" rx="12" fill="#FFFFFF" stroke="#D8C5B9"/>
        <text x="16" y="58" font-size="16">Superficie</text>
        <text x="16" y="80" font-size="13" fill="#6F5A51">#FFFFFF</text>
      </g>
      <g transform="translate(688 24)">
        <rect width="156" height="94" rx="12" fill="#155E75"/>
        <text x="16" y="58" font-size="16" fill="#FFFFFF">Foco</text>
        <text x="16" y="80" font-size="13" fill="#FFFFFF">#155E75</text>
      </g>
    </g>

    <g transform="translate(1000 210)">
      <text y="0" font-size="14" font-weight="700" letter-spacing="1.5">TIPOGRAFÍA DEL SISTEMA</text>
      <text y="58" font-family="ui-serif, Georgia, serif" font-size="34" font-weight="700">Cuidado en cada detalle</text>
      <text y="96" font-size="17" fill="#6F5A51">Lectura clara, cercana y sin descarga de fuentes.</text>
      <text y="130" font-size="14" font-weight="700" letter-spacing="1">ETIQUETA BREVE</text>
    </g>

    <g transform="translate(72 390)">
      <text y="0" font-size="14" font-weight="700" letter-spacing="1.5">MÓVIL · ORDEN LINEAL</text>
      <rect y="24" width="320" height="520" rx="28" fill="#FFFFFF" stroke="#D8C5B9" stroke-width="2"/>
      <text x="24" y="64" font-size="12" font-weight="700" fill="#6F5A51">REGIÓN DE MARCA PENDIENTE</text>
      <rect x="24" y="84" width="272" height="176" rx="16" fill="#F1DED2"/>
      <path d="M112 186l42-48 34 36 26-25 42 51H76z" fill="#C45E47" opacity="0.56"/>
      <text x="24" y="298" font-family="ui-serif, Georgia, serif" font-size="29" font-weight="700">Una idea con</text>
      <text x="24" y="330" font-family="ui-serif, Georgia, serif" font-size="29" font-weight="700">intención</text>
      <text x="24" y="362" font-size="15" fill="#6F5A51">Producto real, contexto útil y una</text>
      <text x="24" y="385" font-size="15" fill="#6F5A51">acción clara, sin ruido ornamental.</text>
      <rect x="24" y="410" width="272" height="48" rx="10" fill="#8F294B"/>
      <text x="160" y="440" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Acción principal</text>
      <rect x="20" y="406" width="280" height="56" rx="14" fill="none" stroke="#155E75" stroke-width="3" stroke-dasharray="7 5"/>
      <text x="24" y="494" font-size="13" font-weight="700">44 px mínimo · foco visible</text>
      <text x="24" y="520" font-size="13" fill="#6F5A51">Sin carrusel ni interacción obligatoria</text>
    </g>

    <g transform="translate(452 390)">
      <text y="0" font-size="14" font-weight="700" letter-spacing="1.5">ESCRITORIO · EXPANSIÓN EDITORIAL</text>
      <rect y="24" width="916" height="520" rx="20" fill="#FFFFFF" stroke="#D8C5B9" stroke-width="2"/>
      <text x="36" y="66" font-size="12" font-weight="700" fill="#6F5A51">REGIÓN DE MARCA PENDIENTE</text>
      <line x1="36" y1="88" x2="880" y2="88" stroke="#D8C5B9"/>
      <g transform="translate(36 126)">
        <text y="20" font-size="13" font-weight="700" letter-spacing="1" fill="#8F294B">DETALLES PERSONALIZADOS</text>
        <text y="76" font-family="ui-serif, Georgia, serif" font-size="42" font-weight="700">Una idea con</text>
        <text y="120" font-family="ui-serif, Georgia, serif" font-size="42" font-weight="700">intención</text>
        <text y="162" font-size="17" fill="#6F5A51">La fotografía cuenta primero. El texto explica</text>
        <text y="188" font-size="17" fill="#6F5A51">lo necesario y mantiene la acción cerca.</text>
        <rect y="224" width="204" height="50" rx="10" fill="#8F294B"/>
        <text x="102" y="255" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Acción principal</text>
        <text y="318" font-size="14" font-weight="700">Orden DOM intacto · medida de lectura limitada</text>
        <text y="346" font-size="14" fill="#6F5A51">Hover complementa; nunca desbloquea contenido.</text>
      </g>
      <g transform="translate(532 126)">
        <rect width="348" height="336" rx="18" fill="#F1DED2"/>
        <circle cx="260" cy="78" r="42" fill="#C45E47" opacity="0.55"/>
        <path d="M48 280l96-126 68 78 48-54 60 102z" fill="#C45E47" opacity="0.68"/>
        <text x="174" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#6F5A51">ESPACIO PARA FOTOGRAFÍA REAL APROBADA</text>
      </g>
    </g>

    <g transform="translate(72 958)">
      <text font-size="14" font-weight="700">Contrato:</text>
      <text x="78" font-size="14" fill="#6F5A51">sin logo inventado · sin fotos sintéticas publicables · tokens semánticos · identidad sustituible</text>
    </g>
  </g>
</svg>
