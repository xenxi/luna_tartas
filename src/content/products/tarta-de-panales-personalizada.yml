name: Tarta de pañales personalizada
summary: 40 pañales, una idea y alguien muy especial. Una tarta preparada a mano y personalizada para dar la bienvenida al bebé.
description: "Cada tarta de Luna se crea a mano con 40 pañales y se personaliza para ese bebé y ese momento especial. Elegimos contigo la temática, los detalles y el acabado para convertir algo tan práctico como unos pañales en un regalo único, bonito y lleno de intención.\n\nPorque cuando llega alguien tan especial, su regalo también debería serlo."
