name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Verify toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Review dependency security and licenses
        run: npm run verify:dependencies

      - name: Lint
        run: npm run lint

      - name: Verify generated catalog contract
        run: npm run verify:schema

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify redirect migration map
        run: npm run verify:redirects

      - name: Build
        run: npm run build

      - name: Verify source asset limits
        run: npm run verify:assets

      - name: Verify performance budgets
        run: npm run verify:performance

      - name: Verify public artifact
        run: npm run verify:artifact

      - name: Verify security and public surface
        run: npm run verify:security

      - name: Verify deterministic build
        run: npm run verify:determinism

      - name: Verify representative mutation is rejected
        run: npm run verify:mutation
