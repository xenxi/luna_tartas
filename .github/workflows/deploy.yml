name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify checked-out commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$GITHUB_SHA^{commit}"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Verify toolchain
        shell: bash
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        shell: bash
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build static site
        shell: bash
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -n "$PAGES_BASE_PATH" ]; then
            npm run build -- --base "$PAGES_BASE_PATH"
          else
            npm run build
          fi

      - name: Check public artifact
        shell: bash
        run: |
          test -f dist/index.html
          test -z "$(find dist -type l -print -quit)"
          npm run verify:assets
          npm run verify:performance
          if grep -rEIlq --exclude='*.map' \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|(password|passwd|secret|token)[[:space:]]*[:=][[:space:]]*["'"'][^"'"']+["'"'])' \
            dist; then
            echo 'Potential credential material found in public artifact.' >&2
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Smoke deployed URL
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          for attempt in {1..12}; do
            status="$(curl --silent --show-error --location \
              --output "$RUNNER_TEMP/pages-smoke.html" \
              --write-out '%{http_code}' \
              "$PAGE_URL")"
            if [ "$status" = '200' ] && grep -qi '<main' "$RUNNER_TEMP/pages-smoke.html"; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done
          echo "Pages smoke failed after 12 attempts (last HTTP status: $status)." >&2
          exit 1
